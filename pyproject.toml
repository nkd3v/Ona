[project]
name = "discord-mod-bot"
version = "0.1.0"
description = "Discord bot that logs deleted messages, removes scam posts and traps spam bots"
requires-python = ">=3.11"
dependencies = [
    "discord.py>=2.7.1,<3",
    "pillow>=11,<13",
    "python-dotenv>=1.1,<2",
]

[dependency-groups]
dev = ["ruff>=0.14,<1"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
